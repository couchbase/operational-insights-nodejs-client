name: Run FIT Testing (Node.js)

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      preset:
        description: FIT presets or preset groups to run, comma-separated. (`fit preset list`)
        required: false
        type: string
        default: insights-multi-lite
      collect_extra_diagnostics:
        description: Collect additional diagnostics (includes cbcollect, is slower)
        required: false
        type: boolean
        default: true
      channel:
        description: fit-cli install channel ("latest" or "ci").
        required: false
        type: string
        default: ci

permissions:
  id-token: write
  contents: read
  checks: write

jobs:
  fit:
    uses: couchbaselabs/fit-cli/.github/workflows/fit-cli.yaml@main
    with:
      preset: ${{ inputs.preset || vars.FIT_CLI_PRESET || 'insights-multi-lite' }}
      collect_extra_diagnostics: ${{ inputs.collect_extra_diagnostics == '' && true || inputs.collect_extra_diagnostics }}
      performer: 'insights-node-fit-performer:main'
      channel: ${{ inputs.channel || vars.FIT_CLI_CHANNEL }}
